<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overflow-390 — the negative control for the mobile overflow check</title>
<style>
  :root { --bg:#fff; --ink:#111; --line:#ddd }
  * { box-sizing: border-box }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--bg) }
  .wrap { max-width:1200px; margin:0 auto; padding:24px }
  /* THE DEFECT, and it is the common one: a desktop grid that never got a mobile rule.
     min-width wins over the viewport, the document scrolls sideways, and nothing else breaks. */
  .grid { display:grid; grid-template-columns:repeat(3, 240px); gap:24px; min-width:768px }
  .card { border:1px solid var(--line); padding:16px }
  h1 { font-size:32px; margin:0 0 16px }
</style></head>
<body>
  <main class="wrap">
    <h1>Negative control</h1>
    <p>This page exists so the mobile-overflow check can be proven to fire. It must keep
       failing <code>mobileOverflow</code> at 390&times;844 forever.</p>
    <div class="grid">
      <div class="card">One</div><div class="card">Two</div><div class="card">Three</div>
    </div>
  </main>
</body></html>
